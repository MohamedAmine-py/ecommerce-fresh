server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files directly, but never treat an asset directory such as
    # /products as a navigable route. The latter is also a React Router path.
    location ~* \.(?:avif|css|gif|html?|ico|jpe?g|js|json|png|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html /index.html;
    }
}
