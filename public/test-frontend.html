<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
    header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; }
    #user-info { font-size: 14px; }
    nav { background: #16213e; display: flex; gap: 4px; padding: 8px 24px; }
    nav button { background: transparent; color: #aaa; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 14px; }
    nav button.active, nav button:hover { background: #0f3460; color: white; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .product-card h3 { margin-bottom: 8px; font-size: 15px; }
    .product-card .price { color: #e94560; font-weight: bold; font-size: 18px; margin: 8px 0; }
    .product-card .stock { font-size: 12px; color: #888; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge.en_cours  { background: #fff3cd; color: #856404; }
    .badge.validee   { background: #d1e7dd; color: #0f5132; }
    .badge.annulee   { background: #f8d7da; color: #842029; }
    input, select, textarea { width: 100%; padding: 8px 12px; margin: 6px 0 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn-primary { background: #0f3460; color: white; }
    .btn-danger  { background: #e94560; color: white; }
    .btn-success { background: #198754; color: white; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .msg { padding: 10px 16px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
    .msg.success { background: #d1e7dd; color: #0f5132; }
    .msg.error   { background: #f8d7da; color: #842029; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f8f9fa; font-weight: 600; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    h2 { margin-bottom: 16px; font-size: 18px; color: #1a1a2e; }
    label { font-size: 13px; font-weight: 600; color: #555; }
  </style>
</head>
<body>

<header>
  <h1>🛍️ ElectroShop</h1>
  <div id="user-info">
    <span id="user-name">Non connecté</span>
    <button class="btn btn-sm" id="logout-btn" style="display:none; margin-left:12px; background:#e94560; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="logout()">Déconnexion</button>
  </div>
</header>

<nav>
  <button class="active" onclick="showSection('products')">Produits</button>
  <button onclick="showSection('cart')">🛒 Panier (<span id="cart-count">0</span>)</button>
  <button onclick="showSection('orders')">Mes Commandes</button>
  <button onclick="showSection('auth')">Connexion</button>
  <button id="admin-btn" style="display:none;" onclick="showSection('admin')">⚙️ Admin</button>
</nav>

<div class="container">

  <!-- PRODUCTS -->
  <div class="section active" id="section-products">
    <div class="card" style="display:flex; gap:12px; align-items:center;">
      <input id="search" placeholder="Rechercher un produit..." style="margin:0; flex:1;" oninput="filterProducts()">
      <select id="cat-filter" style="margin:0; width:200px;" onchange="filterProducts()">
        <option value="">Toutes les catégories</option>
      </select>
    </div>
    <div class="grid" id="products-grid"></div>
  </div>

  <!-- CART -->
  <div class="section" id="section-cart">
    <h2>Mon Panier</h2>
    <div class="card">
      <div id="cart-items"></div>
      <div style="text-align:right; margin-top:16px;">
        <strong>Total : <span id="cart-total">0.00</span> €</strong><br><br>
        <button class="btn btn-success" onclick="placeOrder()">✅ Passer la commande</button>
      </div>
    </div>
    <div id="cart-msg"></div>
  </div>

  <!-- ORDERS -->
  <div class="section" id="section-orders">
    <h2>Mes Commandes</h2>
    <div id="orders-list"></div>
  </div>

  <!-- AUTH -->
  <div class="section" id="section-auth">
    <div style="max-width:400px; margin:0 auto;">
      <div class="card">
        <h2>Connexion</h2>
        <div id="login-msg"></div>
        <label>Email</label>
        <input id="login-email" type="email" placeholder="admin@ecommerce.com">
        <label>Mot de passe</label>
        <input id="login-password" type="password" placeholder="admin123">
        <button class="btn btn-primary" style="width:100%" onclick="login()">Se connecter</button>
        <p style="text-align:center; margin-top:12px; font-size:13px;">Pas de compte ? <a href="#" onclick="toggleRegister()">S'inscrire</a></p>
      </div>
      <div class="card" id="register-form" style="display:none;">
        <h2>Inscription</h2>
        <div id="register-msg"></div>
        <label>Nom</label>
        <input id="reg-nom" placeholder="Votre nom">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="email@example.com">
        <label>Mot de passe</label>
        <input id="reg-password" type="password" placeholder="Min. 6 caractères">
        <button class="btn btn-success" style="width:100%" onclick="register()">Créer mon compte</button>
      </div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="section" id="section-admin">
    <h2>⚙️ Tableau de Bord Admin</h2>
    <div id="admin-stats" class="grid" style="margin-bottom:24px;"></div>

    <div class="card">
      <h2>Ajouter un produit</h2>
      <div id="add-product-msg"></div>
      <label>Nom</label><input id="p-nom" placeholder="Nom du produit">
      <label>Description</label><input id="p-desc" placeholder="Description">
      <label>Prix (€)</label><input id="p-prix" type="number" placeholder="0.00">
      <label>Stock</label><input id="p-stock" type="number" placeholder="0">
      <label>Catégorie</label>
      <select id="p-cat"></select>
      <button class="btn btn-primary" onclick="addProduct()">Ajouter le produit</button>
    </div>

    <div class="card">
      <h2>Gestion des Commandes</h2>
      <div id="admin-orders"></div>
    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:8000/api';
  let token = localStorage.getItem('token');
  let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  let allProducts = [];

  // ── HELPERS ──────────────────────────────────────────────────

  async function api(method, endpoint, body = null) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + endpoint, { method, headers, body: body ? JSON.stringify(body) : null });
    return res.json();
  }

  function showMsg(id, text, type) {
    document.getElementById(id).innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('section-' + name).classList.add('active');
    event.target.classList.add('active');
    if (name === 'orders') loadOrders();
    if (name === 'admin') loadAdmin();
  }

  function updateUserUI() {
    if (currentUser) {
      document.getElementById('user-name').textContent = `👤 ${currentUser.nom} (${currentUser.role})`;
      document.getElementById('logout-btn').style.display = 'inline-block';
      document.getElementById('admin-btn').style.display = currentUser.role === 'admin' ? 'inline-block' : 'none';
    } else {
      document.getElementById('user-name').textContent = 'Non connecté';
      document.getElementById('logout-btn').style.display = 'none';
      document.getElementById('admin-btn').style.display = 'none';
    }
  }

  // ── AUTH ─────────────────────────────────────────────────────

  async function login() {
    const data = await api('POST', '/login', {
      email: document.getElementById('login-email').value,
      mot_de_passe: document.getElementById('login-password').value,
    });
    if (data.token) {
      token = data.token;
      currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      updateUserUI();
      showMsg('login-msg', 'Connecté avec succès !', 'success');
      setTimeout(() => showSection('products'), 1000);
    } else {
      showMsg('login-msg', data.message || 'Erreur de connexion', 'error');
    }
  }

  async function register() {
    const data = await api('POST', '/register', {
      nom: document.getElementById('reg-nom').value,
      email: document.getElementById('reg-email').value,
      mot_de_passe: document.getElementById('reg-password').value,
    });
    if (data.token) {
      token = data.token;
      currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      updateUserUI();
      showMsg('register-msg', 'Compte créé avec succès !', 'success');
      setTimeout(() => showSection('products'), 1000);
    } else {
      const errors = data.errors ? Object.values(data.errors).flat().join('<br>') : data.message;
      showMsg('register-msg', errors, 'error');
    }
  }

  async function logout() {
    if (token) await api('POST', '/logout');
    token = null; currentUser = null;
    localStorage.removeItem('token'); localStorage.removeItem('user');
    updateUserUI();
  }

  function toggleRegister() {
    const f = document.getElementById('register-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  }

  // ── PRODUCTS ─────────────────────────────────────────────────

  async function loadProducts() {
    const data = await api('GET', '/products?per_page=50');
    allProducts = data.data || [];
    renderProducts(allProducts);

    const cats = await api('GET', '/categories');
    const catFilter = document.getElementById('cat-filter');
    const pCat = document.getElementById('p-cat');
    cats.forEach(c => {
      catFilter.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
      if (pCat) pCat.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
    });
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    if (!products.length) { grid.innerHTML = '<p>Aucun produit trouvé.</p>'; return; }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <div style="font-size:11px; color:#888; margin-bottom:4px;">${p.categorie?.nom || ''}</div>
        <h3>${p.nom}</h3>
        <div class="price">${parseFloat(p.prix).toFixed(2)} €</div>
        <div class="stock">Stock : ${p.stock}</div>
        <button class="btn btn-primary btn-sm" style="width:100%" onclick="addToCart(${p.id}, '${p.nom}', ${p.prix})" ${p.stock === 0 ? 'disabled' : ''}>
          ${p.stock === 0 ? 'Rupture de stock' : '+ Ajouter au panier'}
        </button>
      </div>
    `).join('');
  }

  function filterProducts() {
    const search = document.getElementById('search').value.toLowerCase();
    const catId = document.getElementById('cat-filter').value;
    const filtered = allProducts.filter(p => {
      const matchName = p.nom.toLowerCase().includes(search);
      const matchCat = !catId || p.categorie_id == catId;
      return matchName && matchCat;
    });
    renderProducts(filtered);
  }

  // ── CART ─────────────────────────────────────────────────────

  function addToCart(id, nom, prix) {
    const existing = cart.find(i => i.id === id);
    if (existing) existing.quantite++;
    else cart.push({ id, nom, prix, quantite: 1 });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(`✅ "${nom}" ajouté au panier!`);
  }

  function updateCartCount() {
    document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.quantite, 0);
  }

  function renderCart() {
    const el = document.getElementById('cart-items');
    if (!cart.length) { el.innerHTML = '<p style="color:#888">Votre panier est vide.</p>'; return; }
    el.innerHTML = cart.map(item => `
      <div class="cart-item">
        <span>${item.nom}</span>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="number" min="1" value="${item.quantite}" style="width:60px; margin:0;" onchange="updateQty(${item.id}, this.value)">
          <span>${(item.prix * item.quantite).toFixed(2)} €</span>
          <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})">✕</button>
        </div>
      </div>
    `).join('');
    const total = cart.reduce((s, i) => s + i.prix * i.quantite, 0);
    document.getElementById('cart-total').textContent = total.toFixed(2);
  }

  function updateQty(id, qty) {
    const item = cart.find(i => i.id === id);
    if (item) item.quantite = parseInt(qty) || 1;
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
  }

  async function placeOrder() {
    if (!token) { showMsg('cart-msg', 'Veuillez vous connecter pour passer une commande.', 'error'); return; }
    if (!cart.length) { showMsg('cart-msg', 'Votre panier est vide.', 'error'); return; }

    const items = cart.map(i => ({ produit_id: i.id, quantite: i.quantite }));
    const data = await api('POST', '/orders', { items });

    if (data.id) {
      cart = [];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      renderCart();
      showMsg('cart-msg', `✅ Commande #${data.id} passée avec succès ! Total : ${data.total} €`, 'success');
    } else {
      showMsg('cart-msg', data.message || 'Erreur lors de la commande', 'error');
    }
  }

  // ── ORDERS ───────────────────────────────────────────────────

  async function loadOrders() {
    if (!token) { document.getElementById('orders-list').innerHTML = '<div class="card"><p>Connectez-vous pour voir vos commandes.</p></div>'; return; }
    const data = await api('GET', '/orders');
    const el = document.getElementById('orders-list');
    if (!data.length) { el.innerHTML = '<div class="card"><p>Aucune commande.</p></div>'; return; }
    el.innerHTML = data.map(o => `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong>Commande #${o.id}</strong>
          <span class="badge ${o.statut}">${o.statut}</span>
        </div>
        <table>
          <tr><th>Produit</th><th>Qté</th><th>Prix unitaire</th><th>Sous-total</th></tr>
          ${o.details.map(d => `
            <tr>
              <td>${d.produit?.nom || 'N/A'}</td>
              <td>${d.quantite}</td>
              <td>${parseFloat(d.prix_unitaire).toFixed(2)} €</td>
              <td>${(d.quantite * d.prix_unitaire).toFixed(2)} €</td>
            </tr>
          `).join('')}
        </table>
        <div style="text-align:right; margin-top:8px;"><strong>Total : ${parseFloat(o.total).toFixed(2)} €</strong></div>
      </div>
    `).join('');
  }

  // ── ADMIN ────────────────────────────────────────────────────

  async function loadAdmin() {
    const stats = await api('GET', '/admin/stats');
    document.getElementById('admin-stats').innerHTML = [
      { label: '👤 Clients', value: stats.total_users },
      { label: '📦 Produits', value: stats.total_produits },
      { label: '🛒 Commandes', value: stats.total_commandes },
      { label: '⏳ En cours', value: stats.commandes_en_cours },
      { label: '💰 Revenus', value: parseFloat(stats.revenus_total || 0).toFixed(2) + ' €' },
    ].map(s => `
      <div class="card" style="text-align:center;">
        <div style="font-size:28px; font-weight:bold; color:#0f3460;">${s.value}</div>
        <div style="font-size:13px; color:#888; margin-top:4px;">${s.label}</div>
      </div>
    `).join('');

    const orders = await api('GET', '/orders');
    document.getElementById('admin-orders').innerHTML = `
      <table>
        <tr><th>ID</th><th>Client</th><th>Total</th><th>Statut</th><th>Action</th></tr>
        ${orders.map(o => `
          <tr>
            <td>#${o.id}</td>
            <td>${o.user?.nom || 'N/A'}</td>
            <td>${parseFloat(o.total).toFixed(2)} €</td>
            <td><span class="badge ${o.statut}">${o.statut}</span></td>
            <td>
              <select onchange="updateOrderStatus(${o.id}, this.value)" style="margin:0; width:130px; padding:4px;">
                <option value="en_cours"  ${o.statut==='en_cours' ?'selected':''}>En cours</option>
                <option value="validee"   ${o.statut==='validee'  ?'selected':''}>Validée</option>
                <option value="annulee"   ${o.statut==='annulee'  ?'selected':''}>Annulée</option>
              </select>
            </td>
          </tr>
        `).join('')}
      </table>
    `;
  }

  async function addProduct() {
    const data = await api('POST', '/products', {
      nom: document.getElementById('p-nom').value,
      description: document.getElementById('p-desc').value,
      prix: parseFloat(document.getElementById('p-prix').value),
      stock: parseInt(document.getElementById('p-stock').value),
      categorie_id: parseInt(document.getElementById('p-cat').value),
    });
    if (data.id) {
      showMsg('add-product-msg', `✅ Produit "${data.nom}" ajouté !`, 'success');
      loadProducts();
    } else {
      const errors = data.errors ? Object.values(data.errors).flat().join('<br>') : data.message;
      showMsg('add-product-msg', errors, 'error');
    }
  }

  async function updateOrderStatus(id, statut) {
    await api('PATCH', `/orders/${id}/status`, { statut });
    loadAdmin();
  }

  // ── INIT ─────────────────────────────────────────────────────
  updateUserUI();
  updateCartCount();
  loadProducts();

  // Render cart when switching to cart section
  document.querySelectorAll('nav button')[1].addEventListener('click', renderCart);
</script>
</body>
</html>
